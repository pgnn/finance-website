apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-website
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-website
  template:
    metadata:
      labels:
        app: finance-website
    spec:
      containers:
        - name: finance-website
          image: "{{ .Values.image }}"
          ports:
            - containerPort: 3000
          env:
            - name: CAR_VERSION
              value: "{{ .Values.imageTag }}"
---
apiVersion: v1
kind: Service
metadata:
  name: finance-website
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: finance-website
  ports:
    - port: 80
      targetPort: 3000
  type: NodePort
